name: Deploy Port Congestion Simulator

on:
  push:
    branches: ["main"]
  workflow_dispatch:

permissions:
  contents: read
  pages: write
  id-token: write

concurrency:
  group: "pages"
  cancel-in-progress: true

jobs:
  validate:
    runs-on: ubuntu-latest
    steps:
      - name: Checkout
        uses: actions/checkout@v4
      - name: Check JavaScript syntax
        run: |
          node --check sim-engine.js
          node --check pixel-art.js
          node --check harbor-renderer.js
          node --check app.js
          node --check tests/smoke.mjs
      - name: Check required web files
        run: |
          test -f index.html
          test -f styles.css
          test -f map.css
          test -f sim-engine.js
          test -f pixel-art.js
          test -f harbor-renderer.js
          test -f app.js
          grep -q 'id="harbor"' index.html
          grep -q 'id="minimap"' index.html
          grep -q 'id="centerMapBtn"' index.html
          grep -q 'id="followMapBtn"' index.html
          grep -q 'pixi.js' index.html
          grep -q 'chart.js' index.html
          grep -q 'sim-engine.js' index.html
          grep -q 'pixel-art.js' index.html
          grep -q 'harbor-renderer.js' index.html
          grep -q 'map.css' index.html
          grep -q 'Nearest' harbor-renderer.js || grep -q 'SCALE_MODES.NEAREST' pixel-art.js
          grep -q 'bindCamera' harbor-renderer.js
          grep -q 'drawMinimap' harbor-renderer.js
          grep -q 'focusShip' app.js
      - name: Run seven-day discrete-event simulation test
        run: node tests/smoke.mjs

  deploy:
    needs: validate
    environment:
      name: github-pages
      url: ${{ steps.deployment.outputs.page_url }}
    runs-on: ubuntu-latest
    steps:
      - name: Checkout
        uses: actions/checkout@v4
      - name: Setup Pages
        uses: actions/configure-pages@v5
      - name: Upload artifact
        uses: actions/upload-pages-artifact@v3
        with:
          path: '.'
      - name: Deploy to GitHub Pages
        id: deployment
        uses: actions/deploy-pages@v4
